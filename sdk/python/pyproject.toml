[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sppu"
version = "0.3.0"
description = "Python bindings for SPPU (Search Processing Unit) SDK"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "SPPU Project"}]

[tool.setuptools.packages.find]
include = ["sppu*"]
